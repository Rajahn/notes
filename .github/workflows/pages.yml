name: 发布电子书

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 mdBook 工具
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-katex
          key: mdbook-0.4.40-katex-0.9.0

      - name: 安装 mdBook 与 mdbook-katex
        run: |
          command -v mdbook || cargo install mdbook --version 0.4.40 --locked
          command -v mdbook-katex || cargo install mdbook-katex --version 0.9.0 --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Playwright 与中文字体
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: 构建网页版与 PDF
        run: scripts/build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
