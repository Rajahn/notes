<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可解释决策学习笔记</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1f2328; --muted: #59636e;
    --line: #d8dee4; --accent: #0b5cad;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181c; --card: #1d2127; --text: #e6e8eb; --muted: #9aa4ae;
      --line: #30363d; --accent: #6cb6ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 1.75rem; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  .book {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px 22px; margin-bottom: 18px;
  }
  .book h2 { font-size: 1.2rem; margin: 0 0 6px; }
  .book p { margin: 0 0 14px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  .links a {
    display: inline-block; padding: 6px 14px; border-radius: 6px;
    border: 1px solid var(--line); color: var(--accent); text-decoration: none;
  }
  .links a:hover { border-color: var(--accent); }
  footer { color: var(--muted); font-size: 0.875rem; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>可解释决策学习笔记</h1>
  <p class="lead">两本配合阅读的书：一本讲一套具体系统怎样设计，一本从零讲这个领域的理论。</p>

  <section class="book">
    <h2>甲篇　可解释决策规则的建模与持续改进：设计说明书</h2>
    <p>逐层说明 engine-cli-minimal 的设计：要解决的问题、目标与原则、各子系统怎样工作、为什么这样取舍。</p>
    <div class="links">
      <a href="design/">在线阅读</a>
      <a href="pdf/design.pdf">下载 PDF</a>
    </div>
  </section>

  <section class="book">
    <h2>乙篇　LLM 驱动的可解释决策学习：理论与学术全景</h2>
    <p>不依赖任何具体系统，从数学预备讲起，经过统计学习、规则学习、神经符号、因果与实验设计，一直到研究前沿。</p>
    <div class="links">
      <a href="theory/">在线阅读</a>
      <a href="pdf/theory.pdf">下载 PDF</a>
    </div>
  </section>

  <footer>PDF 与网页内容相同，可离线阅读。书仍在写作中，目录中暂不可点的章节尚未完成。</footer>
</main>
</body>
</html>
